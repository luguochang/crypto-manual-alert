global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option redispatch
  retries 3
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  timeout check 2s

resolvers docker
  nameserver docker_dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 250ms
  hold valid 2s

frontend aegra_gateway
  bind :8080
  acl health_path path -i /health
  use_backend aegra_health if health_path
  default_backend aegra_pool

backend aegra_health
  option httpchk GET /health
  http-check expect status 200
  server-template aegra 1-8 langgraph-api:8000 check resolvers docker init-addr libc,none inter 2s fall 2 rise 2

backend aegra_pool
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  server-template aegra 1-8 langgraph-api:8000 check resolvers docker init-addr libc,none inter 2s fall 2 rise 2
