global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option redispatch
  retries 3
  timeout connect 1s
  timeout client 30s
  timeout server 30s
  timeout check 1s

resolvers docker
  nameserver docker_dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 100ms
  hold other 1s
  hold refused 1s
  hold nx 1s
  hold timeout 1s
  hold valid 1s
  hold obsolete 1s

frontend aegra_gateway
  bind :8080
  acl health_path path -i /health
  use_backend aegra_health if health_path
  default_backend aegra_pool

backend aegra_health
  balance roundrobin
  option httpchk
  retry-on conn-failure empty-response response-timeout 502 503 504
  http-check send meth GET uri /health ver HTTP/1.1 hdr Host langgraph-api
  http-check expect status 200
  server replica-a "${AEGRA_REPLICA_A}":8000 check resolvers docker init-addr libc,none resolve-prefer ipv4 inter 500ms fastinter 200ms downinter 200ms fall 1 rise 1
  server replica-b "${AEGRA_REPLICA_B}":8000 check resolvers docker init-addr libc,none resolve-prefer ipv4 inter 500ms fastinter 200ms downinter 200ms fall 1 rise 1

backend aegra_pool
  balance roundrobin
  option httpchk
  http-check send meth GET uri /health ver HTTP/1.1 hdr Host langgraph-api
  http-check expect status 200
  server replica-a "${AEGRA_REPLICA_A}":8000 check resolvers docker init-addr libc,none resolve-prefer ipv4 inter 500ms fastinter 200ms downinter 200ms fall 1 rise 1
  server replica-b "${AEGRA_REPLICA_B}":8000 check resolvers docker init-addr libc,none resolve-prefer ipv4 inter 500ms fastinter 200ms downinter 200ms fall 1 rise 1
