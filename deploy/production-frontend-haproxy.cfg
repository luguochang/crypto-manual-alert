global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 2s
  timeout client 60s
  timeout server 60s

frontend product_ingress
  bind :8080
  acl health_path path -i /health
  use_backend frontend_health if health_path
  default_backend frontend_app

backend frontend_health
  http-request return status 200 content-type text/plain string ok

backend frontend_app
  option httpchk GET /work
  http-check expect status 200
  server frontend frontend:3001 check inter 5s fall 2 rise 2
