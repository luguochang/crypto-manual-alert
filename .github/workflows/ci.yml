name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Install locked Python environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.28
          uv sync --project backend --frozen
      - name: Backend and deployment contracts
        run: uv run --project backend pytest backend/tests/unit backend/tests/contract tests/deployment tools/v2/tests -q
      - name: Frontend checks
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run test:unit
          npm --prefix frontend run build
      - name: Production asset schema
        run: uv run --project backend pytest tests/deployment/test_task14_repository_assets.py -q

  protected-release:
    if: startsWith(github.ref, 'refs/tags/v2-')
    needs: [source, production-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: v2-production
    permissions:
      contents: read
      id-token: write
    env:
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE }}
      FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
      INGRESS_IMAGE: ${{ vars.INGRESS_IMAGE }}
      PRODUCT_POSTGRES_IMAGE: ${{ vars.PRODUCT_POSTGRES_IMAGE }}
      AGENT_POSTGRES_IMAGE: ${{ vars.AGENT_POSTGRES_IMAGE }}
      REDIS_IMAGE: ${{ vars.REDIS_IMAGE }}
      PRODUCT_POSTGRES_DB: ${{ vars.PRODUCT_POSTGRES_DB }}
      PRODUCT_POSTGRES_USER: ${{ vars.PRODUCT_POSTGRES_USER }}
      PRODUCT_POSTGRES_PASSWORD: ${{ secrets.PRODUCT_POSTGRES_PASSWORD }}
      AGENT_POSTGRES_DB: ${{ vars.AGENT_POSTGRES_DB }}
      AGENT_POSTGRES_USER: ${{ vars.AGENT_POSTGRES_USER }}
      AGENT_POSTGRES_PASSWORD: ${{ secrets.AGENT_POSTGRES_PASSWORD }}
      PRODUCT_DATABASE_URL: ${{ secrets.PRODUCT_DATABASE_URL }}
      AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER }}
      INTERNAL_JWT_KEY_ID: ${{ vars.INTERNAL_JWT_KEY_ID }}
      INTERNAL_JWT_ISSUER: ${{ vars.INTERNAL_JWT_ISSUER }}
      INTERNAL_JWT_PRIVATE_KEY_PATH: ${{ secrets.INTERNAL_JWT_PRIVATE_KEY_PATH }}
      INTERNAL_JWT_PUBLIC_KEY_PATH: ${{ secrets.INTERNAL_JWT_PUBLIC_KEY_PATH }}
      PRODUCT_INBOX_CURSOR_KEY_PATH: ${{ secrets.PRODUCT_INBOX_CURSOR_KEY_PATH }}
      NOTIFICATION_CREDENTIAL_KEY: ${{ secrets.NOTIFICATION_CREDENTIAL_KEY }}
      NOTIFICATION_CREDENTIAL_KEY_VERSION: ${{ vars.NOTIFICATION_CREDENTIAL_KEY_VERSION }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
      PRODUCTION_INGRESS_PORT: "8080"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate production topology
        run: docker compose -f deploy/docker-compose.production.yml config --quiet
      - name: Require externally verified release evidence
        run: |
          test -n "${{ vars.RELEASE_EVIDENCE_VERIFIED_SHA }}"
          test "${{ vars.RELEASE_EVIDENCE_VERIFIED_SHA }}" = "${GITHUB_SHA}"

  production-images:
    if: startsWith(github.ref, 'refs/tags/v2-')
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and scan locked production images
        run: |
          bash tools/v2/build_production_images.sh \
            --source-sha "$GITHUB_SHA" \
            --backend-image crypto-alert-backend:ci \
            --frontend-image crypto-alert-frontend:ci \
            --evidence-dir "$RUNNER_TEMP/production-image-evidence" \
            --output-digest "$RUNNER_TEMP/production-image-set-digest.txt"
